<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ressource</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout : une colonne calme, vues par onglets (haut sur ordinateur, barre basse sur téléphone), cartes seulement pour les blocs à manipuler */
:root{
  --bg:#EAF0EC; --surface:#F8FAF8; --surface-2:#DDE6E1; --ink:#15221E; --muted:#56685F; --line:#C9D5CF;
  --accent:#1E6B58; --accent-ink:#FFFFFF; --accent-soft:#D0E6DD;
  --water:#2C73B0; --water-soft:#D4E4F2; --energy:#B97C12; --stress:#7E52AB; --pain:#BB4A38; --sleep:#3E52A3;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1715; --surface:#16211E; --surface-2:#21302B; --ink:#E4EDE9; --muted:#98AAA2; --line:#2B3B35;
  --accent:#5EC0A4; --accent-ink:#06211A; --accent-soft:#1C3a31;
  --water:#6AADE6; --water-soft:#163049; --energy:#E2AD4C; --stress:#B794DD; --pain:#EA806D; --sleep:#8E9EF0;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1715; --surface:#16211E; --surface-2:#21302B; --ink:#E4EDE9; --muted:#98AAA2; --line:#2B3B35;
  --accent:#5EC0A4; --accent-ink:#06211A; --accent-soft:#1C3a31;
  --water:#6AADE6; --water-soft:#163049; --energy:#E2AD4C; --stress:#B794DD; --pain:#EA806D; --sleep:#8E9EF0;
  color-scheme:dark }
/* Couleurs d'ambiance au choix (Réglages) */
:root[data-accent="lagon"]{--accent:#1D6A97;--accent-soft:#D2E4F0}
:root[data-accent="prune"]{--accent:#7A4786;--accent-soft:#EBDDF0}
:root[data-accent="ambre"]{--accent:#9E5418;--accent-soft:#F3E2D0}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"])[data-accent="lagon"]{--accent:#6BB8E6;--accent-ink:#06202F;--accent-soft:#173247}
  :root:not([data-theme="light"])[data-accent="prune"]{--accent:#C79BD5;--accent-ink:#24122B;--accent-soft:#33223A}
  :root:not([data-theme="light"])[data-accent="ambre"]{--accent:#E8A066;--accent-ink:#2B1706;--accent-soft:#3A2717}}
:root[data-theme="dark"][data-accent="lagon"]{--accent:#6BB8E6;--accent-ink:#06202F;--accent-soft:#173247}
:root[data-theme="dark"][data-accent="prune"]{--accent:#C79BD5;--accent-ink:#24122B;--accent-soft:#33223A}
:root[data-theme="dark"][data-accent="ambre"]{--accent:#E8A066;--accent-ink:#2B1706;--accent-soft:#3A2717}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
.wrap{max-width:980px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}

/* En-tête */
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync[data-s="ok"] i{background:var(--accent)} .sync[data-s="warn"] i{background:var(--energy)} .sync[data-s="err"] i{background:var(--pain)}

/* Navigation */
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 22px}
nav.tabs a{display:flex;align-items:center;gap:7px;padding:10px 14px;color:var(--muted);text-decoration:none;font-weight:700;border-bottom:3px solid transparent;margin-bottom:-1px;border-radius:8px 8px 0 0}
nav.tabs a:hover{color:var(--ink);background:var(--surface-2)}
nav.tabs a[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
nav.tabs svg{width:18px;height:18px}
@media (max-width:700px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;margin:0;background:var(--surface);border-bottom:0;border-top:1px solid var(--line);
    justify-content:space-around;gap:0;padding:4px max(6px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  nav.tabs a{flex-direction:column;gap:2px;font-size:.7rem;padding:6px 4px;border-bottom:0;border-radius:10px;flex:1;text-align:center}
  nav.tabs a[aria-current="page"]{background:var(--accent-soft)}
  nav.tabs svg{width:22px;height:22px}
}

/* Blocs */
.stack{display:flex;flex-direction:column;gap:28px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:22px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:18px;min-width:0}
.solo{max-width:640px;width:100%}
.linkcard{flex-direction:row;align-items:center;justify-content:space-between;text-decoration:none;color:inherit}
.linkcard:hover{border-color:var(--accent)}
.linkcard .arrow{font-size:1.6rem;color:var(--accent);font-weight:700}
.card > header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.banner{background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:5px 12px;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;padding:0}

/* Résumé du jour */
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.summary > a{background:var(--surface);padding:14px 16px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:2px;min-width:0}
.summary > a:hover{background:var(--surface-2)}
.summary b{font-family:var(--font-display);font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.summary small{color:var(--muted);font-size:.82rem}
@media (max-width:620px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Curseurs */
.metric{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.metric label{font-weight:700}
.metric output{font-family:var(--font-display);font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums;min-width:3.2ch;text-align:right;color:var(--c)}
.metric output.empty{color:var(--muted);font-weight:500;font-size:.9rem}
.metric input[type=range]{grid-column:1 / -1;width:100%;accent-color:var(--c);height:28px}
.metric .scale{grid-column:1 / -1;display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);margin-top:-4px}
.metric.unset input[type=range]{opacity:.55}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-weight:700;font-size:.92rem}
input[type=text],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
textarea{resize:vertical;min-height:84px}

/* Eau */
.water{display:grid;grid-template-columns:70px 1fr;gap:18px;align-items:center}
.tube{height:170px;border:2px solid var(--water);border-radius:12px 12px 22px 22px;position:relative;overflow:hidden;background:var(--water-soft)}
.tube .fill{position:absolute;left:0;right:0;bottom:0;background:var(--water);transition:height .5s ease}
.tube .marks{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:6px 0}
.tube .marks span{height:1px;background:color-mix(in srgb,var(--surface) 55%,transparent);margin-left:auto;width:40%}
.water .big{font-family:var(--font-display);font-size:2rem;font-weight:700;color:var(--water);line-height:1}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

/* Habitudes */
.habits{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.habits button{width:100%;display:flex;gap:12px;align-items:center;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.habits button .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);flex:none;display:grid;place-items:center}
.habits button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.habits button[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.habits button[aria-pressed="true"] .box::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.meter{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.meter span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}

/* Respiration */
.breath{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:760px){.breath{grid-template-columns:1fr}}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;align-items:center;gap:16px}
.orb-wrap{width:min(78vw,300px);aspect-ratio:1;max-width:100%;display:grid;place-items:center;position:relative}
.orb-ring{position:absolute;inset:0;border-radius:50%;border:2px dashed var(--line)}
.orb{width:100%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 38% 34%,color-mix(in srgb,var(--accent) 45%,var(--surface)),var(--accent) 70%);transform:scale(.55);display:grid;place-items:center;color:var(--accent-ink);text-align:center;will-change:transform}
.orb .ph{font-family:var(--font-display);font-size:1.5rem;font-weight:700;line-height:1.1}
.orb .sec{font-size:2.6rem;font-family:var(--font-display);font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.patterns{display:flex;flex-direction:column;gap:8px}
.pattern{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;border:1px solid var(--line);background:var(--surface);border-radius:12px;cursor:pointer;text-align:left;width:100%}
.pattern[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pattern b{font-family:var(--font-display);font-size:1.02rem}
.pattern small{color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;cursor:pointer;font-weight:700;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.timeline{width:100%;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.timeline span{display:block;height:100%;background:var(--accent);width:0}

/* Assiette */
.gauge{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
@media (max-width:520px){.gauge{grid-template-columns:1fr;justify-items:center;text-align:center}}
.gauge svg{width:150px;height:150px}
.meals{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.meals li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.meals li:last-child{border-bottom:0}
.meals .m{font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;width:5.5rem;flex:none}
.meals .n{flex:1;min-width:0;overflow-wrap:anywhere}
.del{background:none;border:0;color:var(--muted);cursor:pointer;font-size:1.2rem;line-height:1;padding:2px 6px;border-radius:6px}
.del:hover{color:var(--pain);background:var(--surface-2)}
.recipes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:14px}
.recipe{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px;display:flex;flex-direction:column;gap:8px;min-width:0}
.recipe h3{font-size:1rem}
.recipe .meta{display:flex;gap:10px;font-size:.85rem;color:var(--muted)}
.recipe .meta b{color:var(--ink);font-variant-numeric:tabular-nums}
.recipe details{font-size:.9rem;color:var(--muted)}
.recipe summary{cursor:pointer;color:var(--accent);font-weight:700}
.recipe .btn{margin-top:auto;align-self:flex-start}
.recipe.pick{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);animation:fadein .4s ease}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tags span{font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.star{background:none;border:0;cursor:pointer;color:var(--muted);padding:2px;border-radius:6px;flex:none}
.star svg path{fill:none}
.star[aria-pressed="true"]{color:var(--energy)}
.star[aria-pressed="true"] svg path{fill:var(--energy)}
.rtools{display:flex;flex-direction:column;gap:10px}
.rtools input[type=search]{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:10px 16px;width:100%}
.rtools .btn{align-self:flex-start}
.chip.small{padding:5px 11px;font-size:.84rem}
.hands{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px}
.hands div{border-left:3px solid var(--accent);padding:2px 0 2px 10px;font-size:.9rem}
.hands b{display:block}
.addfree{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;align-items:end}
@media (max-width:620px){.addfree{grid-template-columns:1fr 1fr}}

/* Suivi */
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;min-width:520px;height:auto}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font-body)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.86rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.avg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.avg div{border-top:3px solid var(--c);padding-top:6px}
.avg b{font-family:var(--font-display);font-size:1.35rem;font-variant-numeric:tabular-nums;display:block}
.avg small{color:var(--muted)}
.empty-state{border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1}
@media (min-width:701px){.toast{bottom:28px}}

/* Prépa et courses */
.seg{display:flex;gap:4px;background:var(--surface-2);border-radius:999px;padding:4px;overflow-x:auto}
.seg a,.seg button{border:0;background:none;cursor:pointer;font:inherit;flex:1;text-align:center;padding:8px 14px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:700;white-space:nowrap;font-size:.92rem}
.seg a[aria-selected="true"],.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.plat{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.plat.on{border-color:var(--accent);background:var(--accent-soft)}
.stepper{display:flex;align-items:center;gap:4px;flex:none;background:var(--surface);border-radius:999px;border:1px solid var(--line);padding:2px}
.stepper button{width:32px;height:32px;border-radius:50%;border:0;background:none;cursor:pointer;font-size:1.2rem;font-weight:700;color:var(--accent)}
.stepper button:hover{background:var(--surface-2)}
.stepper span{min-width:2ch;text-align:center;font-weight:700}
.week{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:10px}
.jourcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.jourcard.today{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.jt{font-family:var(--font-display);font-weight:700;text-transform:capitalize}
.slot{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:.88rem;padding:5px 0;border-top:1px dashed var(--line)}
.slot .sm{width:4.6rem;flex:none;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--muted)}
.slot .sn{flex:1;min-width:0;display:inline-flex;align-items:center;gap:4px}
.slot.libre .sn{color:var(--muted);font-style:italic}
.slot.mange .sn{text-decoration:line-through;color:var(--muted)}
.flake{width:14px;height:14px;color:var(--water);flex:none}
.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:10px}
.steps ul{margin:4px 0 0;padding-left:1.1em;color:var(--muted);font-size:.92rem}
.shop .q{color:var(--muted);font-size:.88rem;white-space:nowrap}
.shop button[aria-pressed="true"] .lbl,.shop button[aria-pressed="true"] .q{text-decoration:line-through;opacity:.6}
/* Accueil */
.hero{position:relative;border-radius:22px;overflow:hidden;margin-top:16px;padding:22px 22px 20px;background:var(--surface);border:1px solid var(--line);isolation:isolate}
.hero::before,.hero::after{content:"";position:absolute;z-index:-1;border-radius:50%;filter:blur(40px);opacity:.55}
.hero::before{width:320px;height:320px;right:-80px;top:-140px;background:var(--accent);animation:drift 16s ease-in-out infinite alternate}
.hero::after{width:260px;height:260px;right:120px;bottom:-190px;background:var(--water);opacity:.32;animation:drift 21s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(-60px,40px) scale(1.15)}}
.hero-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.hero h1{font-size:clamp(1.9rem,6vw,2.7rem);font-weight:700;line-height:1.02}
.hero .date{color:var(--muted);margin-top:6px;text-transform:capitalize}
.hero .phrase{font-family:var(--font-display);font-weight:500;font-size:1.08rem;margin:14px 0 0;max-width:46ch;line-height:1.35}
.hero-actions{display:flex;gap:8px;align-items:center}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 80%,transparent);color:var(--ink);text-decoration:none}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn svg{width:20px;height:20px}
.sos{background:var(--stress);color:#fff;border:0;border-radius:999px;padding:10px 16px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:8px;box-shadow:0 6px 18px -8px var(--stress)}
:root[data-theme="dark"] .sos{color:#1A1022}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sos{color:#1A1022}}
.sos:hover{filter:brightness(1.08)}
.hero-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hero-bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.plant-link{flex:none;width:84px;display:block;border-radius:14px}
.plant-link:hover{background:color-mix(in srgb,var(--surface) 60%,transparent)}
@media (max-width:520px){.plant-link{width:62px}}
.sway{transform-origin:50px 86px;animation:sway 6s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
.pixels{display:grid;grid-template-rows:repeat(7,11px);grid-auto-flow:column;grid-auto-columns:11px;gap:3px;width:max-content}

/* ---------- Stockage ---------- */
const store = {mode:'loading',days:{},settings:{...DEFAULT_SETTINGS},col:null};
const timers={}, chains={};
function setSync(s,txt){const el=$('#sync');el.dataset.s=s;el.lastElementChild.textContent=txt;el.hidden=(s==='ok');}
function day(k){return {...DAY_DEFAULT,...(store.days[k]||{})};}
function editDay(k,fn){const d=day(k);fn(d);store.days[k]=d;queue(k);}
function editSettings(fn){const s=JSON.parse(JSON.stringify(store.settings));fn(s);store.settings=s;queue('reglages');}
function queue(k){clearTimeout(timers[k]);setSync('warn','Enregistrement…');timers[k]=setTimeout(()=>flush(k),600);}
function flush(k){
  delete timers[k];
  const data = JSON.parse(JSON.stringify(k==='reglages'?store.settings:store.days[k]));
  if(store.mode==='db'){
    chains[k]=(chains[k]||Promise.resolve()).then(()=>store.col.doc(k).set(data))
      .then(()=>{ if(!Object.keys(timers).length) setSync('ok','Enregistré'); })
      .catch(()=>setSync('err','Échec d’enregistrement — réessaie dans un instant'));
  } else {
    try{localStorage.setItem('ressource-v1',JSON.stringify({days:store.days,settings:store.settings}));setSync('warn','Enregistré sur cet appareil uniquement');}
    catch(e){setSync('err','Stockage indisponible — rien n’est conservé');}
  }
}
async function initStore(){
  let db=null,user=null;
  try{ if(window.claude?.use){ [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]); } }catch(e){}
  if(db && user){
    try{
      const id = await user.id();
      store.col = db.collection('data/users/'+id);
      store.mode='db';
      const slow=setTimeout(()=>setSync('warn','Connexion lente — les données arrivent…'),10000);
      store.col.onSnapshot(snap=>{
        if(!snap.metadata.fromCache){clearTimeout(slow); if(!Object.keys(timers).length) setSync('ok','Synchronisé');}
        let changed=false;
        for(const doc of snap.docs){
          if(timers[doc.id]) continue;
          const data=doc.data(); if(!data) continue;
          if(doc.id==='reglages'){
            const next={...DEFAULT_SETTINGS,...data};
            if(JSON.stringify(next)!==JSON.stringify(store.settings)){store.settings=next;changed=true;}
          } else if(/^\d{4}-\d{2}-\d{2}$/.test(doc.id)){
            if(JSON.stringify(data)!==JSON.stringify(store.days[doc.id])){store.days[doc.id]=data;changed=true;}
          }
        }
        if(changed) render(true);
      },()=>{clearTimeout(slow);setSync('err','Données inaccessibles pour le moment');});
      return;
    }catch(e){}
  }
  store.mode='local';
  try{const raw=localStorage.getItem('ressource-v1'); if(raw){const o=JSON.parse(raw);store.days=o.days||{};store.settings={...DEFAULT_SETTINGS,...(o.settings||{})};}}catch(e){}
  setSync('warn','Enregistré sur cet appareil uniquement');
  render(true);
}

function besoins(s=store.settings){
  const {age,taille,poids,activite,deficit,sexe}=s;
  if(!age||!taille||!poids) return null;
  const mb = 10*poids + 6.25*taille - 5*age + (sexe==='H'?5:-161);
  const dej = mb*activite;
  const plancher = Math.max(Math.round(mb), sexe==='H'?1500:1200);
  const obj = Math.max(Math.round(dej*(1-deficit/100)/10)*10, plancher);
  return {mb:Math.round(mb),dej:Math.round(dej),obj,plancher:obj===plancher};
}

function dayOfYear(d=new Date()){return Math.floor((d-new Date(d.getFullYear(),0,0))/864e5);}
function weekKey(d=new Date()){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);
  const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return `${t.getUTCFullYear()}-S${pad(Math.ceil(((t-y0)/864e5+1)/7))}`;}

  soleil:'<svg viewBox="0 0 24 24" fill="none" stroke="var(--energy)" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5" fill="var(--energy)"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',

  nuage:'<svg viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round"><path d="M7 18h10a4 4 0 0 0 0-8 5.5 5.5 0 0 0-10.5 1.6A3.3 3.3 0 0 0 7 18z" fill="var(--surface-2)"/></svg>',
  orage:'<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-width="2"><path d="M7 15h10a4 4 0 0 0 0-8 5.5 5.5 0 0 0-10.5 1.6A3.3 3.3 0 0 0 7 15z" fill="var(--surface-2)" stroke="var(--stress)"/><path d="M12 15l-2 4h3l-2 4" stroke="var(--energy)"/></svg>',

function meteo(d){
  if(d.energie==null&&d.stress==null) return ['vide','Météo intérieure à noter'];
  const s=(d.energie??5)-(d.stress??5)-((d.douleur??0)>=6?2:0);
  return s>=3?['soleil','Météo intérieure : grand soleil']:s>=0?['eclaircie','Météo intérieure : éclaircies']:s>=-3?['nuage','Météo intérieure : nuageux']:['orage','Météo intérieure : orageux, sois douce avec toi'];
}
/* --- Mon jardin : une plante qui pousse avec ce que tu fais pour toi --- */
const STADES=[[0,'Graine'],[6,'Pousse'],[16,'Jeune tige'],[30,'Feuillage'],[48,'En bouton'],[70,'En fleur']];
function pointsJour(d){
  return d.habitudes.length+d.soins.length+(d.grat.some(Boolean)||d.victoire?1:0)+(d.respi>0?1:0)+(d.eau>=store.settings.eau?1:0)+(d.pauses||0)+d.apaise.length+(d.energie!=null?1:0);
}
function jardin(){
  const pts=lastKeys(14).map(day).reduce((a,d)=>a+pointsJour(d),0);
  let stage=0;STADES.forEach(([s],i)=>{if(pts>=s)stage=i;});
  const next=STADES[stage+1];
  return {pts,stage,nom:STADES[stage][1],reste:next?next[0]-pts:0,suivant:next?.[1]};
}
function planteSVG(stage,small){
  const H=[0,14,28,40,50,56][stage],top=84-H;
  let g='';
  if(stage===0) g+=`<ellipse cx="50" cy="83" rx="5" ry="3.5" fill="var(--energy)"/>`;
  else{
    g+=`<path d="M50 85 Q${stage>2?46:48} ${84-H/2} 50 ${top}" stroke="var(--accent)" stroke-width="3.2" fill="none" stroke-linecap="round"/>`;
    const nl=Math.min(stage,4);
    for(let j=0;j<nl;j++){const y=84-H*(.28+.17*j),side=j%2?1:-1,len=13-j*1.5;
      g+=`<path d="M50 ${y} q${side*len*.6} ${-len*.75} ${side*len} ${-len*.25} q${-side*len*.25} ${len*.5} ${-side*len} ${len*.25}z" fill="var(--accent)" opacity="${.75+j*.06}"/>`;}
    if(stage===1) g+=`<path d="M50 ${top} q-7 -4 -9 2 q5 2 9 -2z M50 ${top} q7 -4 9 2 q-5 2 -9 -2z" fill="var(--accent)"/>`;
    if(stage===4) g+=`<ellipse cx="50" cy="${top-4}" rx="5" ry="7" fill="var(--pain)" opacity=".85"/><path d="M45 ${top} q5 -5 10 0" stroke="var(--accent)" stroke-width="2.5" fill="none"/>`;
    if(stage===5){for(let p=0;p<6;p++){const a=p*Math.PI/3;g+=`<ellipse cx="${(50+Math.cos(a)*7).toFixed(1)}" cy="${(top-6+Math.sin(a)*7).toFixed(1)}" rx="5.5" ry="4" transform="rotate(${p*60} ${(50+Math.cos(a)*7).toFixed(1)} ${(top-6+Math.sin(a)*7).toFixed(1)})" fill="var(--pain)" opacity=".88"/>`;}
      g+=`<circle cx="50" cy="${top-6}" r="4.5" fill="var(--energy)"/>`;}
  }
  return `<svg viewBox="0 0 100 112" role="img" aria-label="${STADES[stage][1]}" style="width:100%;height:auto;display:block">
    <g class="sway">${g}</g>
    <ellipse cx="50" cy="86" rx="26" ry="5" fill="var(--ink)" opacity=".18"/>
    <path d="M24 86 h52 l-6 22 q-1 3 -4 3 h-32 q-3 0 -4 -3z" fill="var(--pain)" opacity=".75"/>
    <rect x="22" y="84" width="56" height="7" rx="2.5" fill="var(--pain)"/>
  </svg>`;
}

const MOTS={

  douleur:['Aucune douleur','Légère','Modérée','Forte','Très forte'],

function motDe(f,v){
  if(f==='sommeilH'){const h=Math.floor(v),m=v%1?'30':'';const q=v<6?'Courte nuit':v<7?'Nuit un peu courte':v<=8.5?'Bonne nuit':'Longue nuit';return `${q} · ${h} h ${m}`.trim();}
  const t=MOTS[f];if(!t)return '';return t[v<=1?0:v<=3?1:v<=6?2:v<=8?3:4];
}

  $$('[data-ob]',v).forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.ob;

    const ob=semaine().objectifs;if(ob[i].ok)toast(ob.every(o=>o.ok)?'Tous tes objectifs de la semaine sont atteints. Bravo !':'Objectif atteint');render();}));
  $$('[data-obdel]',v).forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.obdel,u=undoSettings();editSemaine(w=>w.objectifs.splice(i,1));toast('Objectif supprimé',u);render();}));
  $('#ob-add',v).addEventListener('submit',e=>{e.preventDefault();const t=$('#ob-t').value.trim();if(!t)return;

  $('#pin-add',v).addEventListener('submit',e=>{e.preventDefault();const t=$('#pin-t').value.trim();if(!t)return;
    editSettings(s=>s.epingles=[...(s.epingles||[]),{t,type:$('#pin-type').value}]);render();});

}

/* --- Respiration --- */
const breath={pattern:'coherence',duree:5,running:false,start:0,raf:0,lock:null,son:'silence',guide:true};
const dureeEff=()=>RESPI[breath.pattern].fixe||breath.duree;
/* Sons d'ambiance générés sur place (aucun fichier externe) */
const audio={ctx:null,nodes:[]};
function sonStart(){
  if(breath.son==='silence'&&!breath.guide) return;
  try{
    audio.ctx=audio.ctx||new (window.AudioContext||window.webkitAudioContext)();audio.ctx.resume?.();
    const ctx=audio.ctx; if(breath.son==='silence') return;
    const len=ctx.sampleRate*4,buf=ctx.createBuffer(1,len,ctx.sampleRate),data=buf.getChannelData(0);
    let last=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;
      if(breath.son==='vagues'){last=(last+0.02*w)/1.02;data[i]=last*3.2;} else data[i]=w*0.5;}
    const src=ctx.createBufferSource();src.buffer=buf;src.loop=true;
    const g=ctx.createGain();g.gain.value=0;
    const f=ctx.createBiquadFilter();
    if(breath.son==='vagues'){f.type='lowpass';f.frequency.value=600;
      const lfo=ctx.createOscillator(),lg=ctx.createGain();lfo.frequency.value=0.09;lg.gain.value=0.16;lfo.connect(lg).connect(g.gain);lfo.start();audio.nodes.push(lfo);
      g.gain.setValueAtTime(0,ctx.currentTime);g.gain.linearRampToValueAtTime(0.22,ctx.currentTime+3);}
    else {f.type='bandpass';f.frequency.value=2500;f.Q.value=0.4;g.gain.setValueAtTime(0,ctx.currentTime);g.gain.linearRampToValueAtTime(0.09,ctx.currentTime+3);}
    src.connect(f).connect(g).connect(ctx.destination);src.start();audio.nodes.push(src,g);
  }catch(e){}
}
function carillon(kind){
  if(!breath.guide||!audio.ctx) return;
  try{const ctx=audio.ctx,o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';
    o.frequency.value=kind==='in'?528:kind==='out'?396:440;
    g.gain.setValueAtTime(0.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.12,ctx.currentTime+0.02);g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+1.4);
    o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+1.5);}catch(e){}
}
function sonStop(){
  const ctx=audio.ctx;if(!ctx)return;
  audio.nodes.forEach(n=>{try{if(n.gain){n.gain.cancelScheduledValues(ctx.currentTime);n.gain.setTargetAtTime(0,ctx.currentTime,0.5);}else n.stop(ctx.currentTime+2);}catch(e){}});
  audio.nodes=[];
}

const reduce=!!window.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches;
async function startBreath(){
  breath.running=true;breath.start=performance.now();
  $('#go').hidden=true;$('#stop').hidden=false;$$('[data-p],[data-d]').forEach(b=>b.disabled=true);
  sonStart();
  try{breath.lock=await navigator.wakeLock?.request('screen');}catch(e){}
  const p=RESPI[breath.pattern],cycle=p.ph.reduce((a,x)=>a+x[1],0),total=dureeEff()*60;
  let lastPh=-1;
  const orb=$('#orb'),ph=$('#ph'),sec=$('#sec'),tl=$('#tl'),rem=$('#remain');
  const S0=.55,S1=1,STOP=.92;
  const tick=now=>{
    const t=(now-breath.start)/1000;
    if(t>=total){endBreath(true);return;}
    let c=t%cycle,i=0;while(c>=p.ph[i][1]){c-=p.ph[i][1];i++;}
    const [lab,len,kind]=p.ph[i],f=c/len;
    let s;
    if(kind==='in') s=p.ph[i+1]?.[2]==='top'?S0+(STOP-S0)*f:S0+(S1-S0)*f;
    else if(kind==='top') s=STOP+(S1-STOP)*f;
    else if(kind==='out') s=S1-(S1-S0)*f;
    else if(kind==='hold') s=S1; else s=S0;
    orb.style.transform=reduce?'scale(.8)':`scale(${s})`;
    if(i!==lastPh){lastPh=i;ph.textContent=lab;ph.style.fontSize=lab.length>14?'1.05rem':'';ph.style.maxWidth='9em';ph.style.margin='0 auto';carillon(kind);}
    sec.textContent=Math.ceil(len-c);
    tl.style.width=(t/total*100)+'%';
    const r=Math.ceil(total-t);rem.textContent=`${Math.floor(r/60)}:${pad(r%60)} restantes`;
    breath.raf=requestAnimationFrame(tick);
  };
  breath.raf=requestAnimationFrame(tick);
}
function endBreath(done){
  cancelAnimationFrame(breath.raf);sonStop();
  const p=RESPI[breath.pattern];
  const mins=done?Math.round(dureeEff()):Math.floor((performance.now()-breath.start)/60000);
  breath.running=false;try{breath.lock?.release();}catch(e){}breath.lock=null;
  if(done&&p.fixe&&p.habit){
    editDay(todayKey(),d=>{d.pauses=(d.pauses||0)+1;const h=store.settings.habitudes.find(x=>p.habit.test(x));if(h&&!d.habitudes.includes(h))d.habitudes=[...d.habitudes,h];});
    toast('Pause terminée. Prête pour le patient suivant.');
  } else if(mins>=1){
    editDay(todayKey(),d=>{d.respi+=mins;const h=store.settings.habitudes.find(x=>/respir/i.test(x));if(h&&!d.habitudes.includes(h))d.habitudes=[...d.habitudes,h];});
    toast(done?`Séance terminée · ${mins} min ajoutées`:`${mins} min ajoutées`);
  } else toast('Séance arrêtée');
  if(breath.fromSos){breath.fromSos=false;sos.step='apres';location.hash='apaiser';return;}
  render();
}

const BILLES=['--accent','--energy','--water','--stress','--pain','--sleep'];
let souvenir=null;
function bonheurs(){
  const out=[];
  for(const [k,d] of Object.entries(store.days).sort()){
    (d.grat||[]).forEach(g=>{if(g&&g.trim())out.push({k,t:g.trim()});});

  }
  return out;
}
function bocalHTML(){
  const all=bonheurs(),n=all.length,shown=Math.min(n,110);
  let billes='';
  const cols=9,r=4.6,x0=27,y0=128;
  for(let i=0;i<shown;i++){const row=Math.floor(i/cols),col=i%cols,off=row%2?r:0;
    const jx=((i*37)%7-3)*.35,jy=((i*53)%5-2)*.3;

    <span class="eyebrow">Étape 1</span><h2>Là, maintenant, c'est à combien ?</h2>
    <p class="muted" style="margin:0">Pas besoin d'être précise. C'est juste pour voir si ça bouge.</p>
    <div class="big-out" id="sos-o">${sos.avant}<span style="font-size:1.2rem" class="muted">/10</span></div>
    <input type="range" id="sos-r" min="0" max="10" value="${sos.avant}" style="accent-color:var(--stress);width:100%" aria-label="Intensité de l'angoisse">
    <div><button class="btn primary" id="sos-next">Continuer</button></div>`;
  else if(sos.step==='outil') body=`
    <span class="eyebrow">Étape 2</span><h2>Qu'est-ce qui te tente ?</h2>
    <div class="tools">
      <button class="tool" data-o="respirer"><b>Respirer, 1 minute</b><small>Le soupir physiologique, guidé. Le plus rapide.</small></button>
      <button class="tool" data-o="ancrage"><b>Revenir ici</b><small>L'ancrage 5-4-3-2-1 avec tes cinq sens.</small></button>
      <button class="tool" data-o="bouger"><b>Bouger le corps</b><small>Décharger la tension par les épaules et les bras.</small></button>
      <button class="tool" data-o="ecrire"><b>Vider ma tête</b><small>Tout écrire, sans trier, puis le poser.</small></button>
    </div>`;
  else if(sos.step==='ancrage'){const [n,l,h]=ANCRAGE[sos.i];body=`
    ${dots(sos.i)}
    <div class="ancre"><div class="n">${n}</div><div><h2>${l}</h2><p class="muted" style="margin:4px 0 0">${h}</p></div></div>
    <p class="muted" style="margin:0">Prends ton temps. Passe à la suite quand c'est fait.</p>
    <div class="btnrow"><button class="btn primary" id="sos-next">${sos.i<ANCRAGE.length-1?'Suivant':'Terminé'}</button></div>`;}
  else if(sos.step==='bouger') body=`
    <span class="eyebrow">Bouger le corps</span><h2>Un mouvement après l'autre</h2>
    <ul class="habits">${BOUGER.map((b,j)=>`<li><button aria-pressed="${sos.coches.includes(j)}" data-b="${j}" style="--accent:var(--stress);--accent-soft:color-mix(in srgb,var(--stress) 16%,var(--surface))"><span class="box"></span>${b}</button></li>`).join('')}</ul>
    <div><button class="btn primary" id="sos-next">C'est fait</button></div>`;
  else if(sos.step==='ecrire') body=`
    <span class="eyebrow">Vider ma tête</span><h2>Écris tout, sans trier</h2>
    <p class="muted" style="margin:0">Les phrases n'ont pas besoin d'être justes ni complètes. Ce texte n'est pas enregistré.</p>
    <textarea id="sos-t" rows="7" placeholder="Ce qui m'inquiète, c'est…">${esc(sos.ecrit)}</textarea>
    <div class="field"><label for="sos-rdv">Je m'autorise à y repenser…</label><select id="sos-rdv"><option>ce soir, 10 minutes, puis je ferme</option><option>demain matin, à tête reposée</option><option>en en parlant à quelqu'un</option></select></div>
    <div><button class="btn primary" id="sos-next">Je pose tout ça</button></div>`;
  else if(sos.step==='apres') body=`
    <span class="eyebrow">Dernière étape</span><h2>Et maintenant, c'est à combien ?</h2>
    <div class="big-out" id="sos-o">${sos.apres??sos.avant}<span style="font-size:1.2rem" class="muted">/10</span></div>
    <input type="range" id="sos-r" min="0" max="10" value="${sos.apres??sos.avant}" style="accent-color:var(--accent);width:100%" aria-label="Intensité après">
    <div><button class="btn primary" id="sos-next">Valider</button></div>`;
  else { const diff=sos.avant-sos.apres; body=`
    <h2>${diff>0?`Ça a baissé de ${diff} point${diff>1?'s':''}.`:'Ça prend parfois plus de temps.'}</h2>
    <p style="margin:0">${diff>0?'Ton système nerveux sait redescendre. Tu viens de le lui rappeler.':'Ce n’est pas un échec. Tu peux essayer un autre outil, ou simplement rester là quelques minutes.'}</p>
    <div class="btnrow"><button class="btn" id="sos-again">Essayer un autre outil</button><a class="btn primary" href="#jour">Revenir à ma journée</a></div>
    <p class="muted" style="margin:0;font-size:.88rem">Si l'angoisse est très forte ou revient souvent, en parler à ton médecin ou à un·e psychologue aide vraiment. Tu n'as pas à gérer ça seule.</p>`; }
  return `<div class="sos-wrap"><div class="sos-step">${body}</div>${sos.step!=='fin'?`<a class="linkbtn" href="#jour" id="sos-quit" style="align-self:center">Quitter le parcours</a>`:''}</div>`;
}
function bApaiser(v){
  const r=$('#sos-r',v);
  if(r) r.addEventListener('input',()=>{$('#sos-o',v).firstChild.textContent=r.value; if(sos.step==='avant')sos.avant=+r.value; else sos.apres=+r.value;});
  $$('[data-o]',v).forEach(b=>b.addEventListener('click',()=>{sos.outil=b.dataset.o;
    if(sos.outil==='respirer'){breath.pattern='soupir';breath.duree=1;breath.fromSos=true;breath.autostart=true;location.hash='respirer';return;}
    sos.step=sos.outil;sos.i=0;sos.coches=[];render();}));
  $$('[data-b]',v).forEach(b=>b.addEventListener('click',()=>{const j=+b.dataset.b;sos.coches=sos.coches.includes(j)?sos.coches.filter(x=>x!==j):[...sos.coches,j];render();}));
  $('#sos-t',v)?.addEventListener('input',e=>sos.ecrit=e.target.value);
  $('#sos-again',v)?.addEventListener('click',()=>{sos.avant=sos.apres;sos.apres=null;sos.step='outil';render();});
  $('#sos-quit',v)?.addEventListener('click',()=>{sos.step='avant';sos.apres=null;});
  $('#sos-next',v)?.addEventListener('click',()=>{
    if(sos.step==='avant') sos.step='outil';
    else if(sos.step==='ancrage'){ if(sos.i<ANCRAGE.length-1){sos.i++;} else sos.step='apres'; }
    else if(sos.step==='bouger') sos.step='apres';
    else if(sos.step==='ecrire'){sos.ecrit='';sos.step='apres';}
    else if(sos.step==='apres'){ if(sos.apres==null)sos.apres=sos.avant;
      const now=new Date();editDay(todayKey(),d=>d.apaise=[...d.apaise,{h:`${pad(now.getHours())}:${pad(now.getMinutes())}`,av:sos.avant,ap:sos.apres,o:sos.outil}]);
      sos.step='fin'; }
    render();window.scrollTo(0,0);
  });
}

/* --- Assiette --- */
let filtreMoment=null;
function momentAuto(){const h=new Date().getHours();return h<10?'matin':h<15?'midi':h<18?'collation':'soir';}

  const d=day(jk()),b=besoins(),kc=kcalOf(d),pr=protOf(d);

  const recents=repasRecents().filter(r=>!d.repas.some(x=>x.n===r.n)).slice(0,6);
  return `<div class="stack">
    ${segHTML('assiette')}
    ${dayNavHTML()}
    <section class="card">
      <div class="gauge">
        <svg viewBox="0 0 150 150" role="img" aria-label="${kc} kcal consommées">

          <circle cx="75" cy="75" r="${R}" fill="none" stroke="${over?'var(--energy)':'var(--accent)'}" stroke-width="13" stroke-linecap="round" stroke-dasharray="${C*pct} ${C}" transform="rotate(-90 75 75)"/>
          <text x="75" y="72" text-anchor="middle" style="font-family:var(--font-display);font-size:28px;font-weight:700" fill="var(--ink)">${b?Math.abs(b.obj-kc):kc}</text>
          <text x="75" y="94" text-anchor="middle" style="font-size:12px" fill="var(--muted)">${b?(over?'kcal au-dessus':'kcal restantes'):'kcal'}</text>
        </svg>
        <div class="stack" style="gap:8px;min-width:0">
          <h2>Aujourd'hui</h2>
          <div class="num">${kc} kcal consommées${b?` · objectif ${b.obj} kcal`:''} · ${pr} g de protéines</div>
          ${b?`<div class="muted" style="font-size:.9rem">Dépense estimée ${b.dej} kcal, déficit de ${store.settings.deficit} %. ${over?'Un dépassement ponctuel ne change rien sur la semaine : regarde la moyenne dans Suivi.':''}</div>`:`<div><a class="btn small primary" href="#reglages">Calculer mon objectif</a></div>`}
          ${d.repas.length?`<ul class="meals">${d.repas.map((r,i)=>`<li><span class="m">${esc(r.m)}</span><span class="n">${esc(r.n)}</span><span class="num muted">${r.k}</span><button class="del" data-del="${i}" aria-label="Retirer ${esc(r.n)}">×</button></li>`).join('')}</ul>`:`<div class="muted">Rien de noté pour l'instant. Choisis une recette ci-dessous ou ajoute un repas librement.</div>`}
        </div>
      </div>
    </section>
    ${recents.length?`<section class="card"><header><h3>Remanger un repas récent</h3><span class="muted">un toucher pour l'ajouter</span></header>
      <div class="chips">${recents.map((r,i)=>`<button type="button" class="chip quick" data-rec="${i}">${esc(r.n)} <span class="muted num">${r.k}</span></button>`).join('')}</div></section>`:''}
    <section class="card">
      <header><h3>Ajouter un repas libre</h3><span class="muted">au restaurant, chez des amis…</span></header>
      <form class="addfree" id="free">
        <div class="field"><label for="f-n">Plat</label><input type="text" id="f-n" required placeholder="ex. Salade niçoise du midi"></div>
        <div class="field"><label for="f-k">kcal estimées</label><input type="number" id="f-k" min="0" max="3000" step="10" required placeholder="500"></div>

        <button class="btn primary" type="submit">Ajouter</button>
      </form>
      <div class="hands">
        <div><b>1 paume</b>viande, poisson, tofu ≈ 150 à 200 kcal</div>
        <div><b>1 poing</b>féculents cuits ≈ 150 kcal</div>
        <div><b>1 pouce</b>huile, beurre, fromage ≈ 90 kcal</div>
        <div><b>2 mains ouvertes</b>légumes, à volonté</div>
      </div>
    </section>
    <a class="card linkcard" href="#recettes"><div><h3>Une idée de repas ?</h3><span class="muted">${RECETTES.length} recettes, à filtrer selon ton envie et ton reste de calories.</span></div><span class="arrow" aria-hidden="true">→</span></a>

function repasRecents(){
  const seen=new Map();
  for(const k of Object.keys(store.days).sort().reverse()) for(const r of [...(store.days[k].repas||[])].reverse()){ if(r&&r.n&&!seen.has(r.n)) seen.set(r.n,r); if(seen.size>=12) break; }
  return [...seen.values()];
}
function recettesSection(fm,b){
  return `    <section class="stack" style="gap:14px">
      <header style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap"><h2>Idées gourmandes</h2><span class="muted num">${RECETTES.length} recettes</span></header>
      <div class="chips" role="group" aria-label="Moment">${MOMENTS.map(([v,l])=>`<button class="chip" data-fm="${v}" aria-pressed="${v===fm}">${l}</button>`).join('')}</div>
      ${fm==='soir'?`<div class="banner" style="padding:10px 14px"><span>Le soir : léger, sans viande rouge ni porc, 400 kcal maximum.</span></div>`:''}
      <div class="rtools">
        <input type="search" id="r-q" placeholder="Chercher : saumon, potiron, tofu…" value="${esc(rf.q)}" aria-label="Chercher une recette">

}
const RTAGS=[['','Toutes'],['fav','Mes favorites'],['sale','Salé'],['rapide','Rapide'],['veggie','Végétarien'],['batch','À préparer d\u2019avance'],['reconfort','Réconfort'],['alsace','Alsace']];
const rf={q:'',tag:'',fit:false,surprise:null};
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function recettesFiltrees(){
  const fm=filtreMoment||momentAuto(),b=besoins(),reste=b?b.obj-kcalOf(day(todayKey())):Infinity,fav=store.settings.favoris||[],q=norm(rf.q.trim());
  return RECETTES.filter(r=>r.m===fm
    &&(!rf.tag||(rf.tag==='fav'?fav.includes(r.id):(r.g||[]).includes(rf.tag)))
    &&(!rf.fit||r.k<=reste)
    &&(!q||norm(r.n+' '+r.d).includes(q)));
}
function recetteCard(r){
  const b=besoins(),fav=(store.settings.favoris||[]).includes(r.id);
  const TL={sale:'Salé',rapide:'Rapide',veggie:'Végé',batch:'D\u2019avance',reconfort:'Réconfort',alsace:'Alsace'};
  return `<article class="recipe ${rf.surprise===r.id?'pick':''}">
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><h3>${esc(r.n)}</h3>
      <button class="star" data-fav="${r.id}" aria-pressed="${fav}" aria-label="${fav?'Retirer des favorites':'Ajouter aux favorites'}"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></button></div>
    <div class="meta"><span><b>${r.k}</b> kcal</span><span><b>${r.p}</b> g prot.</span>${r.t?`<span><b>${r.t}</b> min</span>`:''}${b?`<span>${Math.round(r.k/b.obj*100)} %</span>`:''}</div>
    ${(r.g||[]).length?`<div class="tags">${r.g.map(g=>`<span>${TL[g]||g}</span>`).join('')}</div>`:''}
    <details><summary>Ingrédients${r.e?' et préparation':''}</summary><p style="margin:.5em 0 0;color:var(--ink)">${esc(r.d)}</p>${r.e?`<p style="margin:.5em 0 0">${esc(r.e)}</p>`:''}</details>
    <button class="btn small primary" data-add="${r.id}">J'ai mangé ça</button>
  </article>`;
}
function recettesHTML(){
  let list=recettesFiltrees();
  if(rf.surprise){const i=list.findIndex(r=>r.id===rf.surprise);if(i>0)list=[list[i],...list.slice(0,i),...list.slice(i+1)];}
  return list.length?list.map(recetteCard).join(''):`<div class="empty-state" style="grid-column:1 / -1">Aucune recette avec ces filtres. Essaie d'en retirer un.</div>`;
}
function bAssiette(v){
  const k=jk();
  const rec=repasRecents().filter(r=>!day(k).repas.some(x=>x.n===r.n)).slice(0,6);
  $$('[data-rec]',v).forEach(b=>b.addEventListener('click',()=>{const r=rec[+b.dataset.rec],u=undoDay(k);
    editDay(k,d=>d.repas=[...d.repas,{n:r.n,k:r.k,p:r.p||0,m:momentAuto()}]);toast(`${r.n} ajouté`,u);render();}));
  $$('[data-fm]',v).forEach(b=>b.addEventListener('click',()=>{filtreMoment=b.dataset.fm;rf.surprise=null;render();}));
  const grid=$('#recipes',v);
  const bindGrid=()=>{ if(!grid) return;
    $$('[data-add]',grid).forEach(b=>b.addEventListener('click',()=>{const r=RECETTES.find(x=>x.id===b.dataset.add);
      const u=undoDay(k);editDay(k,d=>d.repas=[...d.repas,{n:r.n,k:r.k,p:r.p,m:r.m}]);toast(`${r.n} ajouté · ${r.k} kcal`,u);rf.surprise=null;render(); }));
    $$('[data-fav]',grid).forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.fav;
      editSettings(s=>{const f=s.favoris||[];s.favoris=f.includes(id)?f.filter(x=>x!==id):[...f,id];});
      const on=(store.settings.favoris||[]).includes(id);b.setAttribute('aria-pressed',on);toast(on?'Ajoutée à tes favorites':'Retirée des favorites');}));
  };
  const refresh=()=>{grid.innerHTML=recettesHTML();bindGrid();};
  if(grid) bindGrid();
  $('#r-q',v)?.addEventListener('input',e=>{rf.q=e.target.value;rf.surprise=null;refresh();});
  $$('[data-tag]',v).forEach(b=>b.addEventListener('click',()=>{rf.tag=b.dataset.tag;rf.surprise=null;render();}));
  $('#r-fit',v)?.addEventListener('click',()=>{rf.fit=!rf.fit;render();});
  $('#r-surprise',v)?.addEventListener('click',()=>{const l=recettesFiltrees().filter(r=>r.id!==rf.surprise);

    rf.surprise=l[Math.floor(Math.random()*l.length)].id;refresh();grid.scrollIntoView({behavior:'smooth',block:'start'});});
  $$('[data-del]',v).forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.del,n=day(k).repas[i]?.n,u=undoDay(k);editDay(k,d=>d.repas=d.repas.filter((_,j)=>j!==i));toast(`${n} retiré`,u);render();}));
  $('#free',v)?.addEventListener('submit',e=>{e.preventDefault();const n=$('#f-n').value.trim(),kc=Math.round(+$('#f-k').value),m=$('#f-m').value;
    if(!n||!(kc>=0))return;const u=undoDay(k);editDay(k,d=>d.repas=[...d.repas,{n,k:kc,p:0,m}]);toast(`${n} ajouté`,u);render();});
}

const MOM_ORDER=['matin','midi','soir','collation'];
const MOM_L={matin:'Matin',midi:'Midi',soir:'Soir',collation:'Collation'};
let prepTab='plan';
function prepa(){return store.settings.prepa||{debut:null,plats:[],manges:[],coches:[],extras:[]};}
function editPrepa(fn){editSettings(s=>{const p=s.prepa||{debut:null,plats:[],manges:[],coches:[],extras:[]};fn(p);s.prepa=p;});}
function debutParDefaut(){const d=new Date(),wd=d.getDay();d.setDate(d.getDate()+(wd===6?2:wd===0?1:1));return keyOf(d);}
function addDays(k,n){const d=new Date(k+'T12:00');d.setDate(d.getDate()+n);return keyOf(d);}
/* Répartition automatique : la conservation la plus courte d'abord, de la variété, et le congélateur au-delà du frigo */
function planifier(p){
  const debut=p.debut||debutParDefaut();
  const reste={};p.plats.forEach(x=>reste[x.id]=x.portions);
  const slots=[];
  for(let i=0;i<7;i++) for(const m of MOM_ORDER){
    const cands=p.plats.map(x=>PLATS.find(y=>y.id===x.id)).filter(pl=>pl&&pl.m.includes(m)&&reste[pl.id]>0&&(i<pl.frigo||pl.cong));
    if(!cands.length){slots.push({i,m,k:addDays(debut,i)});continue;}
    const hier=slots.find(s=>s.i===i-1&&s.m===m)?.id;
    const memeJour=new Set(slots.filter(s=>s.i===i&&s.id).map(s=>s.id));
    cands.sort((a,b)=>(a.m[0]!==m)-(b.m[0]!==m)||memeJour.has(a.id)-memeJour.has(b.id)||(a.id===hier)-(b.id===hier)||a.frigo-b.frigo||reste[b.id]-reste[a.id]);
    const pl=cands[0];reste[pl.id]--;
    slots.push({i,m,k:addDays(debut,i),id:pl.id,cong:i>=pl.frigo});
  }
  return {debut,slots,restes:reste};
}
function qteFmt(q,u){
  if(u==='g'){return q>=1000?(Math.round(q/100)/10).toLocaleString('fr-FR')+' kg':Math.round(q/10)*10+' g';}
  if(u==='ml'){return q>=1000?(Math.round(q/100)/10).toLocaleString('fr-FR')+' L':Math.round(q/10)*10+' ml';}
  if(u==='cl'){return Math.ceil(q/20)*20+' cl';}
  const n=Math.ceil(q-0.05);
  const lab={pc:'',boîte:n>1?'boîtes':'boîte',botte:n>1?'bottes':'botte',pot:n>1?'pots':'pot',sachet:n>1?'sachets':'sachet'}[u];
  return n+(lab?' '+lab:'');
}

  const kcVals=days.map(kcalOf), maxK=Math.max(2500,...kcVals,b?b.obj:0);
  const eauVals=days.map(d=>d.eau/1000), maxE=Math.max(2.5,...eauVals);

  return `<div class="stack">
    ${subHTML('suivi',ST,st)}
    ${st==='jardin'?haut:''}
    ${st==='bilan'?`<section class="card"><header><h3>Moyennes des 7 derniers jours</h3></header>
      <div class="avg">
        <div style="--c:var(--energy)"><b>${fmt(avg(d=>d.energie,last7))}</b><small>énergie /10</small></div>
        <div style="--c:var(--stress)"><b>${fmt(avg(d=>d.stress,last7))}</b><small>stress /10</small></div>
        <div style="--c:var(--pain)"><b>${fmt(avg(d=>d.douleur,last7))}</b><small>douleur EVA /10</small></div>
        <div style="--c:var(--sleep)"><b>${fmt(avg(d=>d.sommeilH,last7))} h</b><small>de sommeil</small></div>
        <div style="--c:var(--accent)"><b>${kcAvg==null?'—':Math.round(kcAvg)}</b><small>kcal/jour${b&&kcAvg!=null?` · ${kcAvg<=b.obj?'dans':'au-dessus de'} l'objectif`:''}</small></div>
        <div style="--c:var(--water)"><b>${fmt(avg(d=>d.eau?d.eau/1000:null,last7))} L</b><small>d'eau par jour</small></div>
      </div>
    </section>
    ${(()=>{const ap=last7.flatMap(d=>d.apaise),soins=last7.reduce((a,d)=>a+d.soins.length,0),journal=last7.filter(d=>d.grat.some(Boolean)||d.victoire).length,rec=last7.reduce((a,d)=>a+d.recadrages.length,0);
      const baisse=ap.length?ap.reduce((a,x)=>a+(x.av-x.ap),0)/ap.length:null;
      return `<section class="card"><header><h3>Prendre soin, 7 derniers jours</h3></header><div class="avg">
        <div style="--c:var(--stress)"><b>${ap.length}</b><small>moment${ap.length>1?'s':''} d'apaisement${baisse!=null?` · −${fmt(baisse)} pt en moyenne`:''}</small></div>
        <div style="--c:var(--accent)"><b>${soins}</b><small>soin${soins>1?'s':''} pour toi</small></div>
        <div style="--c:var(--energy)"><b>${journal}/7</b><small>soirs avec journal</small></div>
        <div style="--c:var(--sleep)"><b>${rec}</b><small>pensée${rec>1?'s':''} recadrée${rec>1?'s':''}</small></div>
      </div></section>`;})()}
    ${(()=>{const notes=days.map((d,i)=>[keys[i],d]).filter(([,d])=>d.note||d.zone).reverse().slice(0,5);
      return notes.length?`<section class="card"><header><h3>Notes récentes</h3></header><ul class="meals">${notes.map(([k,d])=>`<li><span class="m">${new Date(k+'T12:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric'})}</span><span class="n">${d.zone?`<b>Douleur : ${esc(d.zone)}.</b> `:''}${esc(d.note)}</span></li>`).join('')}</ul></section>`:'';})()}`:''}
    ${st==='courbes'?`<section class="card"><header><h3>Ressenti</h3><div class="legend"><span><i style="background:var(--energy)"></i>Énergie</span><span><i style="background:var(--stress)"></i>Stress</span><span><i style="background:var(--pain)"></i>Douleur</span></div></header>
      ${lineChart(keys,[{c:'--energy',vals:days.map(d=>d.energie)},{c:'--stress',vals:days.map(d=>d.stress)},{c:'--pain',vals:days.map(d=>d.douleur)}],10,[0,2,4,6,8,10])}</section>
    <div class="grid2">
      <section class="card"><header><h3>Sommeil</h3><div class="legend"><span><i style="background:var(--sleep)"></i>Heures</span></div></header>
        ${lineChart(keys,[{c:'--sleep',vals:days.map(d=>d.sommeilH)}],sleepMax,[0,2,4,6,8,10])}</section>
      <section class="card"><header><h3>Hydratation</h3><span class="muted">litres</span></header>
        ${barChart(keys,eauVals,store.settings.eau/1000,'--water',Math.ceil(maxE*2)/2)}</section>
    </div>
    <section class="card"><header><h3>Calories</h3><span class="muted">kcal par jour${b?`, objectif ${b.obj}`:''}</span></header>
      ${barChart(keys,kcVals,b?b.obj:null,'--accent',Math.ceil(maxK/500)*500)}</section>`:''}
  </div>`;
}

function bReglages(v){
  const num=(id,f,parse=Number)=>$('#'+id,v).addEventListener('change',e=>{const x=e.target.value===''?null:parse(e.target.value);editSettings(s=>s[f]=x);render();});
  num('s-age','age');num('s-taille','taille');num('s-poids','poids');num('s-act','activite');num('s-eau','eau');
  $('#s-prenom',v).addEventListener('input',e=>{editSettings(s=>s.prenom=e.target.value);renderHero();});
  $$('[data-acc]',v).forEach(b=>b.addEventListener('click',()=>{editSettings(s=>s.accent=b.dataset.acc);render();}));
  $('#s-sexe',v).addEventListener('change',e=>{editSettings(s=>s.sexe=e.target.value);render();});
  $$('[data-def]',v).forEach(b=>b.addEventListener('click',()=>{editSettings(s=>s.deficit=+b.dataset.def);render();}));
  $('#s-save-hab',v).addEventListener('click',()=>{const list=$('#s-hab').value.split('\n').map(x=>x.trim()).filter(Boolean).slice(0,15);
    editSettings(s=>s.habitudes=list.length?list:DEFAULT_SETTINGS.habitudes);toast('Liste enregistrée');render();});
  $('#s-url-copy',v).addEventListener('click',async()=>{const i=$('#s-url');try{await navigator.clipboard.writeText(i.value);toast('Lien copié');}catch(e){i.select();toast('Lien sélectionné : copie-le');}});
  $('#s-copy',v).addEventListener('click',async()=>{const txt=JSON.stringify({reglages:store.settings,jours:store.days},null,2);
    try{await navigator.clipboard.writeText(txt);toast('Données copiées');}catch(e){toast('Copie impossible ici');}});
}

/* --- Mode widget : l'essentiel sur un seul écran, à épingler sur l'écran d'accueil --- */
const APP_URL='https://claude.ai/artifact/XvdWjHPrSvqVwGQWmENCLd';
function vRapide(){
  const k=todayKey(),d=day(k),goal=store.settings.eau,pct=Math.min(100,Math.round(d.eau/goal*100));
  const todo=store.settings.habitudes.filter(h=>!d.habitudes.includes(h)),nH=store.settings.habitudes.length;
  const ob=semaine().objectifs||[],[ic,met]=meteo(d),p=store.settings.prenom?.trim(),h=new Date().getHours();
  const line=(f,l,c)=>{const v=d[f];return `<div class="metric ${v==null?'unset':''}" style="--c:var(${c})"><label class="mlabel" for="w-${f}">${l}</label>
    <output id="wo-${f}" class="${v==null?'empty':''}">${v==null?'glisse sur la ligne':motDe(f,v)}</output>
    <input type="range" class="line" id="w-${f}" data-wf="${f}" min="0" max="10" step="1" value="${v??5}" style="--p:${v==null?0:v*10}%"></div>`;};
  return `<div class="wgt">
    <div class="w-head"><div><b>${(h<5||h>=18?'Bonsoir':'Bonjour')+(p?', '+esc(p):'')}</b><span class="pill">${METEO_ICONS[ic]}${esc(met.replace('Météo intérieure : ',''))}</span></div>
      <a class="iconbtn" href="#jour" aria-label="Ouvrir l'app complète"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></a></div>
    <button type="button" class="w-water" data-weau="250" style="--pct:${pct}%">
      <span class="w-fill" aria-hidden="true"></span>
      <span class="w-txt"><b>+ Un verre d'eau</b><span class="num">${fmtL(d.eau)} sur ${fmtL(goal)}${pct>=100?' · objectif atteint':''}</span></span>
    </button>
    <section class="card w-card"><h3>Comment je vais</h3>${line('energie','Énergie','--energy')}${line('stress','Stress','--stress')}</section>
    <section class="card w-card"><header><h3>Habitudes</h3><span class="muted num">${nH-todo.length}/${nH}</span></header>
      ${todo.length?`<div class="chips">${todo.map((x,i)=>`<button type="button" class="chip quick" data-wh="${i}">${esc(x)}</button>`).join('')}</div>`:`<p class="muted" style="margin:0">Toutes cochées aujourd'hui.</p>`}</section>
    ${ob.length?`<section class="card w-card"><header><h3>Mes objectifs</h3><span class="muted num">${ob.filter(o=>o.ok).length}/${ob.length}</span></header>
      <ul class="habits">${ob.map((o,i)=>`<li><button aria-pressed="${!!o.ok}" data-wob="${i}"><span class="box"></span><span class="lbl">${esc(o.t)}</span></button></li>`).join('')}</ul></section>`:''}
    <div class="w-actions">
      <a class="sos" href="#apaiser">M'apaiser</a>
      <a class="btn" href="#respirer" id="w-pause">Pause 90 s</a>
      <a class="btn" href="#assiette">Noter un repas</a>
    </div>
  </div>`;
}
function bRapide(v){
  const k=todayKey();
  $('[data-weau]',v).addEventListener('click',()=>{const u=undoDay(k),avant=day(k).eau;editDay(k,d=>{if(d.eauX==null)d.eauX=d.eauM.length?0:d.eau;d.eauX+=250;d.eau=eauTotal(d);});
    toast(day(k).eau>=store.settings.eau&&avant<store.settings.eau?'Objectif hydratation atteint':'+250 mL',u);render();});
  $$('input.line',v).forEach(inp=>{const f=inp.dataset.wf;
    const show=()=>{const val=+inp.value,o=$('#wo-'+f,v);inp.style.setProperty('--p',val*10+'%');o.textContent=motDe(f,val);o.classList.remove('empty');inp.closest('.metric').classList.remove('unset');};
    inp.addEventListener('input',show);inp.addEventListener('change',()=>{show();editDay(k,d=>d[f]=+inp.value);renderHero();});});
  const todo=store.settings.habitudes.filter(h=>!day(k).habitudes.includes(h));
  $$('[data-wh]',v).forEach(b=>b.addEventListener('click',()=>{const h=todo[+b.dataset.wh],u=undoDay(k);editDay(k,d=>d.habitudes=[...d.habitudes,h]);toast(`${h} : cochée`,u);render();}));
  $$('[data-wob]',v).forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.wob;editSemaine(w=>{w.objectifs[i]={...w.objectifs[i],ok:!w.objectifs[i].ok};});render();}));
  $('#w-pause',v).addEventListener('click',()=>{if(!breath.running)breath.pattern='pause';});
}
/* --- Actions rapides --- */
function sheetHTML(){
  const k=todayKey(),d=day(k),todo=store.settings.habitudes.filter(h=>!d.habitudes.includes(h)),rec=repasRecents().slice(0,4);
  return `<div class="sheet-grip" aria-hidden="true"></div>
    <div class="sheet-head"><h2>Rapide</h2><button type="button" class="iconbtn" id="sheet-x" aria-label="Fermer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="qa-grid">
      <button type="button" class="qa" data-qa="eau"><span class="qa-i" style="--c:var(--water)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/></svg></span><b>Un verre d'eau</b><small class="num">${d.eau} mL aujourd'hui</small></button>
      <button type="button" class="qa" data-qa="apaiser"><span class="qa-i" style="--c:var(--stress)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12c3-5 6-5 9 0s6 5 9 0"/></svg></span><b>M'apaiser</b><small>parcours guidé</small></button>
      <button type="button" class="qa" data-qa="pause"><span class="qa-i" style="--c:var(--accent)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg></span><b>Pause 90 s</b><small>entre deux patients</small></button>
      <button type="button" class="qa" data-qa="checkin"><span class="qa-i" style="--c:var(--energy)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg></span><b>Mon check-in</b><small>${d.energie==null?'pas encore fait':'énergie '+d.energie+'/10'}</small></button>
    </div>
    ${todo.length?`<div class="stack" style="gap:10px"><span class="eyebrow">Cocher une habitude</span><div class="chips">${todo.map((h,i)=>`<button type="button" class="chip quick" data-qh="${i}">${esc(h)}</button>`).join('')}</div></div>`:`<p class="muted" style="margin:0">Toutes tes habitudes du jour sont cochées.</p>`}
    <div class="stack" style="gap:10px"><span class="eyebrow">J'ai mangé</span><div class="chips">${rec.map((r,i)=>`<button type="button" class="chip quick" data-qr="${i}">${esc(r.n)} <span class="muted num">${r.k}</span></button>`).join('')}<a class="chip quick" href="#recettes" data-close>Autre chose…</a></div></div>`;
}
function openSheet(){const sh=$('#sheet');sh.innerHTML=sheetHTML();sh.hidden=false;$('#sheet-bg').hidden=false;$('#fab').setAttribute('aria-expanded','true');document.body.classList.add('noscroll');bindSheet();$('#sheet-x').focus();}
function closeSheet(){$('#sheet').hidden=true;$('#sheet-bg').hidden=true;$('#fab').setAttribute('aria-expanded','false');document.body.classList.remove('noscroll');}
function bindSheet(){
  const sh=$('#sheet'),k=todayKey();
  $('#sheet-x').onclick=closeSheet;
  $$('[data-close]',sh).forEach(a=>a.addEventListener('click',closeSheet));
  $$('[data-qa]',sh).forEach(b=>b.addEventListener('click',()=>{const a=b.dataset.qa;
    if(a==='eau'){const u=undoDay(k);editDay(k,d=>{if(d.eauX==null)d.eauX=d.eauM.length?0:d.eau;d.eauX+=250;d.eau=eauTotal(d);});toast(`+250 mL · ${day(k).eau} mL aujourd'hui`,u);sh.innerHTML=sheetHTML();bindSheet();if(current==='jour')render();return;}
    closeSheet();
    if(a==='apaiser') location.hash='apaiser';
    if(a==='pause'){if(!breath.running)breath.pattern='pause';if(location.hash==='#respirer')render();else location.hash='respirer';}
    if(a==='checkin'){jourSel=null;sub.jour='checkin';if(location.hash==='#jour')render();else location.hash='jour';}
  }));
  const todo=store.settings.habitudes.filter(h=>!day(k).habitudes.includes(h));
  $$('[data-qh]',sh).forEach(b=>b.addEventListener('click',()=>{const h=todo[+b.dataset.qh],u=undoDay(k);editDay(k,d=>d.habitudes=[...d.habitudes,h]);toast(`${h} : cochée`,u);sh.innerHTML=sheetHTML();bindSheet();render(true);}));
  const rec=repasRecents().slice(0,4);
  $$('[data-qr]',sh).forEach(b=>b.addEventListener('click',()=>{const r=rec[+b.dataset.qr],u=undoDay(k);editDay(k,d=>d.repas=[...d.repas,{n:r.n,k:r.k,p:r.p||0,m:momentAuto()}]);toast(`${r.n} ajouté · ${r.k} kcal`,u);closeSheet();render();}));
}
$('#fab').addEventListener('click',()=>$('#sheet').hidden?openSheet():closeSheet());
$('#sheet-bg').addEventListener('click',closeSheet);
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet();});
addEventListener('hashchange',()=>{if(!$('#sheet').hidden)closeSheet();$('#fab').hidden=['apaiser'].includes(location.hash.slice(1));});
$('#pause-pill').addEventListener('click',()=>{if(breath.running)return;breath.pattern='pause';if(location.hash==='#respirer')render();});
$('#today-label').textContent=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
addEventListener('hashchange',()=>{
  const h=location.hash.slice(1);
  if(breath.running){ breath.fromSos=false; endBreath(false); }
  if(h==='apaiser' && sos.step==='fin'){sos.step='avant';sos.apres=null;}
  if(h!=='respirer') breath.fromSos=breath.autostart=false;
  render(); window.scrollTo(0,0);
});
render();
initStore();
</script>
